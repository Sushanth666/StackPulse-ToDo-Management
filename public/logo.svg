<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Main Ribbon Gradient: Deep Violet to Vibrant Electric Indigo & Sky -->
    <linearGradient id="sp-ribbon-body" x1="10" y1="80" x2="90" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 3D Under-Fold Shadow -->
    <linearGradient id="sp-ribbon-shadow" x1="30" y1="50" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Left Wing Facet -->
    <linearGradient id="sp-ribbon-wing" x1="10" y1="35" x2="45" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Specular Highlight along top ridge -->
    <linearGradient id="sp-ribbon-shine" x1="35" y1="75" x2="85" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e0e7ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 8) scale(1.15)">
    <!-- 3D Dimensional Rear Fold -->
    <path
      d="M22 34.5 L28 40.5 C29.8 42.3 32.6 41.8 33.8 39.5 L48.8 14.8 C49.7 13.3 48.2 11.7 46.7 12.6 L26.8 26.5 Z"
      fill="url(#sp-ribbon-shadow)"
      opacity="0.95"
    />

    <!-- Main Rising Velocity Ribbon -->
    <path
      d="M12.8 28.5 C11.1 26.5 12.8 23.5 15.2 24.5 L23.9 30.4 C25.4 31.3 27.2 31 28.4 29.6 L47.2 10 C48.8 8.3 51.4 10 50.6 12.1 L41.2 37.5 C40.1 40.4 37.6 42.5 34.6 43.1 L24.7 45.1 C22.1 45.6 19.6 44.4 18.1 42.3 Z"
      fill="url(#sp-ribbon-body)"
    />

    <!-- Left Wing Facet -->
    <path
      d="M12.8 28.5 C11.3 26.7 12.6 24 14.9 24.8 L24.8 31.1 C26.6 32.3 27.2 34.5 26.1 36.5 L23.7 40.5 C22.2 43.1 18.8 43.5 16.7 41.3 Z"
      fill="url(#sp-ribbon-wing)"
    />

    <!-- Top Ridge Specular Highlight -->
    <path
      d="M14.9 24.8 L24.8 31.1 C26.3 32 28.2 31.7 29.4 30.5 L47.8 11.2 C48.7 10.3 50.1 11.1 49.8 12.2 L40.7 36.6 C39.8 39 37.7 40.8 35.2 41.4 L25.3 43.4 Z"
      fill="url(#sp-ribbon-shine)"
      opacity="0.5"
    />
  </g>
</svg>
