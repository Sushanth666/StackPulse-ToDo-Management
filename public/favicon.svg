<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-lightning-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB020" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FF4838" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5722" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1.5" />

  <!-- Lightning Bolt -->
  <path
    d="M37 10 L16 35 H29 L27 54 L48 29 H35 L37 10 Z"
    fill="url(#fav-lightning-grad)"
    filter="url(#fav-glow)"
    stroke="#FFA726"
    stroke-width="1"
    stroke-linejoin="round"
  />
</svg>